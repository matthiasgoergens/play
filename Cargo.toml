[package]
name = "rps"
version = "0.1.0"
edition = "2021"
description = "Iterated rock-paper-scissors between pluggable agents (LLM-backed or local)"

[[bin]]
name = "rps"
path = "src/bin/rps.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
rand = "0.8"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
