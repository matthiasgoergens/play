<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RPS Arena — two minds, side by side</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --ink: #e6e8ec; --muted: #8b919c;
    --a: #c98b5e; --b: #5e9bc9; --line: #2a2e37;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 12px 18px; border-bottom: 1px solid var(--line);
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0 12px 0 0; font-weight: 650; }
  header label { color: var(--muted); font-size: 13px; }
  header input {
    background: var(--panel); border: 1px solid var(--line); color: var(--ink);
    border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 13px;
  }
  header input.spec { width: 200px; }
  header input.rounds { width: 56px; }
  button {
    background: var(--ink); color: #14161a; border: 0; border-radius: 6px;
    padding: 6px 14px; font: inherit; font-weight: 650; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  #status { color: var(--muted); font-size: 13px; margin-left: auto; }

  #board { display: grid; grid-template-columns: 1fr 1fr; height: calc(100vh - 56px); }
  .col { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); }
  .col:last-child { border-right: 0; }
  .col-head {
    padding: 10px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 10px;
  }
  .col-name { font-weight: 650; }
  .col.a .col-name { color: var(--a); }
  .col.b .col-name { color: var(--b); }
  .col-score { color: var(--muted); font-size: 13px; }
  .feed { overflow-y: auto; padding: 8px 18px 40px; scroll-behavior: smooth; }

  .card { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .round-no { color: var(--muted); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  .move {
    font-weight: 700; font-size: 13px; padding: 2px 9px; border-radius: 999px;
    border: 1px solid var(--line);
  }
  .col.a .move { color: var(--a); }
  .col.b .move { color: var(--b); }
  .verdict { font-size: 12px; color: var(--muted); }
  .verdict.win { color: #6cc070; }
  .verdict.loss { color: #c0706c; }
  .reasoning { white-space: pre-wrap; color: #d2d6dd; }
  .reasoning.empty { color: var(--muted); font-style: italic; }
  .hint { padding: 24px 18px; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <h1>RPS Arena</h1>
    <label>left <input id="p1" class="spec" value="anthropic" /></label>
    <label>right <input id="p2" class="spec" value="gemini" /></label>
    <label>rounds <input id="rounds" class="rounds" type="number" min="1" max="100" value="10" /></label>
    <button id="start">Start</button>
    <span id="status">idle</span>
  </header>

  <div id="board">
    <section class="col a">
      <div class="col-head"><span class="col-name" id="nameA">left</span><span class="col-score" id="scoreA"></span></div>
      <div class="feed" id="feedA"><p class="hint">Press Start. Each model thinks out loud; only their moves are relayed between them.</p></div>
    </section>
    <section class="col b">
      <div class="col-head"><span class="col-name" id="nameB">right</span><span class="col-score" id="scoreB"></span></div>
      <div class="feed" id="feedB"></div>
    </section>
  </div>

<script>
  let es = null;
  const $ = (id) => document.getElementById(id);

  function setStatus(t) { $("status").textContent = t; }

  function clearFeeds() {
    $("feedA").innerHTML = "";
    $("feedB").innerHTML = "";
    $("scoreA").textContent = "";
    $("scoreB").textContent = "";
  }

  function appendCard(col, side, data) {
    const feed = col === "a" ? $("feedA") : $("feedB");
    const card = document.createElement("div");
    card.className = "card";

    const head = document.createElement("div");
    head.className = "card-head";
    head.innerHTML =
      `<span class="round-no">round ${data.round}</span>` +
      `<span class="move">${side.move}</span>` +
      `<span class="verdict ${side.outcome === "win" ? "win" : side.outcome === "loss" ? "loss" : ""}">${side.outcome}</span>`;

    const reasoning = document.createElement("div");
    const text = (side.reasoning || "").trim();
    reasoning.className = "reasoning" + (text ? "" : " empty");
    reasoning.textContent = text || "(no commentary)";

    card.appendChild(head);
    card.appendChild(reasoning);
    feed.appendChild(card);
    feed.scrollTop = feed.scrollHeight;
  }

  function handle(msg) {
    switch (msg.type) {
      case "start":
        $("nameA").textContent = msg.a;
        $("nameB").textContent = msg.b;
        setStatus(`playing ${msg.rounds} rounds…`);
        break;
      case "round":
        appendCard("a", msg.a, msg);
        appendCard("b", msg.b, msg);
        $("scoreA").textContent = `${msg.score.a} won`;
        $("scoreB").textContent = `${msg.score.b} won`;
        setStatus(`round ${msg.round} done`);
        break;
      case "done":
        setStatus(`match complete · ${msg.score.a}–${msg.score.b} (${msg.score.draws} draws)`);
        if (es) es.close();
        $("start").disabled = false;
        break;
      case "error":
        setStatus("error: " + msg.message);
        if (es) es.close();
        $("start").disabled = false;
        break;
    }
  }

  function start() {
    if (es) es.close();
    clearFeeds();
    const p1 = encodeURIComponent($("p1").value.trim() || "anthropic");
    const p2 = encodeURIComponent($("p2").value.trim() || "gemini");
    const rounds = encodeURIComponent($("rounds").value || "10");
    $("start").disabled = true;
    setStatus("connecting…");
    es = new EventSource(`/stream?rounds=${rounds}&p1=${p1}&p2=${p2}`);
    es.onmessage = (e) => handle(JSON.parse(e.data));
    es.onerror = () => { setStatus("connection closed"); $("start").disabled = false; };
  }

  $("start").addEventListener("click", start);
</script>
</body>
</html>
